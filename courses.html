<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#3d2b1f">
  <meta name="apple-mobile-web-app-title" content="Repas">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.json">
  <title>Repas — Courses</title>
  <script>/* Thème posé avant l'affichage (pas de flash clair en mode sombre) */try{var t=JSON.parse(localStorage.getItem('repas_theme'));if(!t&&matchMedia('(prefers-color-scheme: dark)').matches)t='dark';if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="nav-logo"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-marmite"/></svg><span>Repas</span></a>
    <div class="nav-links" id="navLinks">
      <a href="planning.html">Planning</a>
      <a href="recettes.html">Recettes</a>
      <a href="preferences.html">Préférences</a>
      <a href="courses.html" class="active">Courses</a>
      <a href="reglages.html">Réglages</a>
    </div>
    <span class="nav-spacer"></span>
    <button class="nav-flash" id="btnFlash" aria-label="Envie du moment"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-eclair"/></svg><span class="nav-flash-label">Envie</span></button>
    <button class="nav-theme" id="btnTheme" title="Changer le thème" aria-label="Changer le thème"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-lune"/></svg></button>
    <button class="nav-theme" id="btnLogout" title="Se déconnecter" aria-label="Se déconnecter"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-sortie"/></svg></button>
  </nav>

  <div class="modal-overlay hidden" id="modalFlash">
    <div class="modal">
      <button class="modal-close" id="modalClose" aria-label="Fermer"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-croix"/></svg></button>
      <div id="modalContent"></div>
    </div>
  </div>

  <main class="main">
    <div class="section-header">
      <h1 class="page-title">Liste de courses</h1>
      <p class="impression-seule" id="impressionCycle"></p>
      <div class="courses-entete">
        <div class="courses-nav">
          <button class="btn btn-secondary btn-sm" id="btnPrevCycle" aria-label="Cycle précédent"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-gauche"/></svg></button>
          <span id="labelSemaineCourses" class="courses-periode"></span>
          <button class="btn btn-secondary btn-sm" id="btnNextCycle" aria-label="Cycle suivant"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-droite"/></svg></button>
        </div>
        <div class="courses-actions">
          <button class="btn btn-secondary btn-sm" id="btnResetCourses"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-annuler"/></svg>Réinitialiser</button>
          <button class="btn btn-secondary btn-sm" id="btnImprimer"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-imprimer"/></svg>Imprimer</button>
        </div>
      </div>
    </div>
    <form id="formArticle" class="courses-ajout" autocomplete="off">
      <label for="champArticle" class="sr-only">Ajouter un article</label>
      <div class="courses-ajout-ligne">
        <input type="text" id="champArticle" class="form-input" placeholder="Ajouter : pain, lessive…" enterkeyhint="done">
        <button type="submit" class="btn btn-primary btn-sm" aria-label="Ajouter l'article"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-plus"/></svg></button>
      </div>
      <div class="courses-ajout-parties" role="group" aria-label="Partie de la liste">
        <button type="button" class="chip" data-partie="samedi"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-panier"/></svg>Samedi magasin</button>
        <button type="button" class="chip" data-partie="mercredi"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-voiture"/></svg>Mercredi drive</button>
      </div>
    </form>
    <div id="coursesList"></div>
  </main>

  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/courses-ui.js"></script>
</body>
</html>
