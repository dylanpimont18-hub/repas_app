<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#3d2b1f">
  <meta name="apple-mobile-web-app-title" content="Repas">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.json">
  <title>Repas — Planning</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="nav-logo"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-marmite"/></svg><span>Repas</span></a>
    <div class="nav-links" id="navLinks">
      <a href="planning.html" class="active">Planning</a>
      <a href="recettes.html">Recettes</a>
      <a href="preferences.html">Préférences</a>
      <a href="courses.html">Courses</a>
      <a href="reglages.html">Réglages</a>
    </div>
    <span class="nav-spacer"></span>
    <button class="nav-flash" id="btnFlash" aria-label="Envie du moment"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-eclair"/></svg><span class="nav-flash-label">Envie</span></button>
    <button class="nav-theme" id="btnTheme" title="Changer le thème" aria-label="Changer le thème"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-lune"/></svg></button>
    <button class="nav-theme" id="btnLogout" title="Se déconnecter" aria-label="Se déconnecter"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-sortie"/></svg></button>
  </nav>

  <div class="modal-overlay hidden" id="modalFlash">
    <div class="modal">
      <button class="modal-close" id="modalClose" aria-label="Fermer"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-croix"/></svg></button>
      <div id="modalContent"></div>
    </div>
  </div>

  <main class="main planning-main">
    <div class="section-header planning-section-header">
      <div class="planning-header-top">
        <h1 class="page-title" style="margin:0;">Planning</h1>
        <button class="btn btn-primary btn-sm" id="btnGenererSemaine"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-etincelle"/></svg>Remplir</button>
      </div>
      <div class="planning-header-nav">
        <button class="btn btn-secondary btn-sm" id="btnPrevWeek" aria-label="Cycle précédent"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-gauche"/></svg></button>
        <span id="labelSemaine" class="text-sm text-muted planning-week-label"></span>
        <a href="reglages.html#reserve" id="badgeReserve" class="reserve-badge hidden" title="Réserve congélo"></a>
        <button class="btn btn-secondary btn-sm" id="btnNextWeek" aria-label="Cycle suivant"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-droite"/></svg></button>
      </div>
    </div>
<div class="planning-grid-wrapper">
      <div class="planning-grid" id="planningGrid"></div>
    </div>

    <div class="modal-overlay hidden" id="modalRecetteSelect">
      <div class="modal">
        <button class="modal-close" id="closeRecetteSelect" aria-label="Fermer"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-croix"/></svg></button>
        <p class="modal-title">Choisir une recette</p>
        <div id="recetteSelectList" style="max-height:360px;overflow-y:auto;"></div>
      </div>
    </div>

    <div class="modal-overlay hidden" id="modalGenSemaine">
      <div class="modal gen-modal">
        <button class="modal-close" id="closeGenSemaine" aria-label="Fermer"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-croix"/></svg></button>
        <p class="modal-title">Remplir le cycle</p>

        <div class="gen-section">
          <div class="gen-section-label">Contraintes <span class="gen-section-aide">sur tous les repas</span></div>
          <div id="genFiltres" class="gen-chips-wrap"></div>
        </div>

        <div class="gen-section">
          <div class="gen-section-label">Envies <span class="gen-section-aide">de temps en temps</span></div>
          <div id="genEnvies" class="envies-liste"></div>
          <input id="genStyle" class="form-input" style="margin-top:0.6rem;" type="text"
            placeholder="Style libre : asiatique, maghrébin…" aria-label="Style libre">
        </div>

        <div class="gen-section">
          <div class="gen-section-label">Repas à remplir (<span id="genCreneauxCount">0</span>)</div>
          <div id="genSlotChips" class="gen-chips-wrap"></div>
        </div>

        <div class="gen-pied">
          <div id="genProgressWrap" class="hidden" style="margin-bottom:0.5rem;">
            <div class="gen-progress-bar"><div id="genProgressFill" class="gen-progress-fill"></div></div>
          </div>
          <p class="text-xs text-muted" id="genStatus" style="margin-bottom:0.5rem;text-align:center;"></p>
          <button class="btn btn-secondary btn-full hidden" id="btnCompleterIA" style="margin-bottom:0.5rem;"></button>
          <div class="gen-actions">
            <button class="btn btn-primary" id="btnLancerGen"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-livre"/></svg>Mes recettes</button>
            <button class="btn btn-accent" id="btnGenererIA"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-etincelle"/></svg>Avec l'IA</button>
          </div>
          <p class="text-xs text-muted gen-aide">« Mes recettes » pioche dans ta bibliothèque. « Avec l'IA » crée de nouvelles recettes.</p>
        </div>
      </div>
    </div>
  </main>

  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/planning-ui.js"></script>
</body>
</html>
