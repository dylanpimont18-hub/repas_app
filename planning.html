<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#3d2b1f">
  <meta name="apple-mobile-web-app-title" content="Repas">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.json">
  <title>Repas — Planning</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="nav-logo">🍽️ Repas</a>
    <button class="nav-burger" id="navBurger" aria-label="Menu">☰</button>
    <div class="nav-links" id="navLinks">
      <a href="planning.html" class="active">📅 Planning</a>
      <a href="recettes.html">📖 Recettes</a>
      <a href="preferences.html">❤️ Préférences</a>
      <a href="courses.html">🛒 Courses</a>
      <a href="reglages.html">⚙️ Réglages</a>
    </div>
    <span class="nav-spacer"></span>
    <button class="nav-flash" id="btnFlash">⚡ Envie</button>
    <button class="nav-theme" id="btnTheme" title="Changer le thème">🌙</button>
    <button class="nav-theme" id="btnLogout" title="Déconnexion">🚪</button>
  </nav>

  <div class="modal-overlay hidden" id="modalFlash">
    <div class="modal">
      <button class="modal-close" id="modalClose">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <main class="main planning-main">
    <div class="section-header planning-section-header">
      <div class="planning-header-top">
        <h1 class="page-title" style="margin:0;">📅 Planning</h1>
        <button class="btn btn-primary btn-sm" id="btnGenererSemaine">✨ Remplir</button>
      </div>
      <div class="planning-header-nav">
        <button class="btn btn-secondary btn-sm" id="btnPrevWeek">←</button>
        <span id="labelSemaine" class="text-sm text-muted planning-week-label"></span>
        <a href="reglages.html#reserve" id="badgeReserve" class="reserve-badge hidden" title="Réserve congélo"></a>
        <button class="btn btn-secondary btn-sm" id="btnNextWeek">→</button>
      </div>
    </div>
<div class="planning-grid-wrapper">
      <div class="planning-grid" id="planningGrid"></div>
    </div>

    <div class="modal-overlay hidden" id="modalRecetteSelect">
      <div class="modal">
        <button class="modal-close" id="closeRecetteSelect">✕</button>
        <p class="modal-title">Choisir une recette</p>
        <div id="recetteSelectList" style="max-height:360px;overflow-y:auto;"></div>
      </div>
    </div>

    <div class="modal-overlay hidden" id="modalGenSemaine">
      <div class="modal gen-modal">
        <button class="modal-close" id="closeGenSemaine">✕</button>
        <p class="modal-title">✨ Remplir le cycle</p>

        <div class="gen-section">
          <div class="gen-section-label">Envies</div>
          <div id="genFiltres" class="gen-chips-wrap"></div>
          <input id="genStyle" class="form-input" style="margin-top:0.5rem;" type="text"
            placeholder="✍️ Style libre… ex : asiatique, maghrébin, plats du Sud">
        </div>

        <div class="gen-section">
          <div class="gen-section-label">Repas à remplir (<span id="genCreneauxCount">0</span>)</div>
          <div id="genSlotChips" class="gen-chips-wrap"></div>
        </div>

        <div class="gen-pied">
          <div id="genProgressWrap" class="hidden" style="margin-bottom:0.5rem;">
            <div class="gen-progress-bar"><div id="genProgressFill" class="gen-progress-fill"></div></div>
          </div>
          <p class="text-xs text-muted" id="genStatus" style="margin-bottom:0.5rem;text-align:center;"></p>
          <button class="btn btn-secondary btn-full hidden" id="btnCompleterIA" style="margin-bottom:0.5rem;"></button>
          <div class="gen-actions">
            <button class="btn btn-primary" id="btnLancerGen">📖 Mes recettes</button>
            <button class="btn btn-accent" id="btnGenererIA">✨ Générer avec l'IA</button>
          </div>
          <p class="text-xs text-muted gen-aide">« Mes recettes » pioche dans ta bibliothèque, sans IA. « Générer » crée de nouvelles recettes pour tous les créneaux choisis.</p>
        </div>
      </div>
    </div>
  </main>

  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/planning-ui.js"></script>
</body>
</html>
